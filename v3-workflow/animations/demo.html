<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rasso · 工作流演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px;
    }
    
    .composition {
      width: 800px;
      height: 450px;
      position: relative;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    
    /* 桌面背景 */
    .desktop {
      position: absolute;
      inset: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><rect fill="%231a1a2e" width="1920" height="1080"/></svg>');
      background-size: cover;
    }
    
    /* 任务栏 */
    .taskbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: rgba(32, 32, 32, 0.9);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .taskbar-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    /* Rasso 启动器窗口 */
    .launcher {
      position: absolute;
      width: 600px;
      left: 50%;
      top: 30%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(32, 32, 32, 0.95);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
      opacity: 0;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    
    .launcher-titlebar {
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #ff5f57; }
    .dot-yellow { background: #febc2e; }
    .dot-green { background: #28c840; }
    
    .launcher-search {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .search-icon {
      width: 20px;
      height: 20px;
      opacity: 0.5;
    }
    .search-input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.3); }
    
    .launcher-results {
      padding: 8px;
    }
    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .result-item.active { background: rgba(0,120,212,0.2); }
    .result-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .result-text { flex: 1; }
    .result-title { font-size: 13px; font-weight: 500; }
    .result-sub { font-size: 11px; color: rgba(255,255,255,0.5); }
    
    /* 插件面板 */
    .plugin-panel {
      position: absolute;
      width: 600px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(245, 245, 247, 0.98);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 16px;
      overflow: hidden;
      opacity: 0;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      color: #1d1d1f;
    }
    
    .plugin-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .plugin-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #0071e3, #00c7be);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }
    .plugin-title { font-size: 15px; font-weight: 600; }
    .plugin-desc { font-size: 12px; color: #6e6e73; }
    
    .plugin-content {
      padding: 20px;
    }
    
    .coders-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .coder-item {
      padding: 16px;
      background: #f5f5f7;
      border: 1px solid #e8e8ed;
      border-radius: 10px;
      text-align: center;
      transition: all 0.15s;
    }
    .coder-item:hover {
      border-color: #0071e3;
      background: rgba(0,113,227,0.04);
    }
    .coder-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .coder-desc { font-size: 11px; color: #6e6e73; }
    
    /* 变量命名插件 */
    .varname-content {
      padding: 20px;
    }
    .varname-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e8e8ed;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      background: #fafafa;
    }
    .varname-results {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .varname-item {
      padding: 12px 16px;
      background: #f5f5f7;
      border: 1px solid #e8e8ed;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .varname-item:hover {
      border-color: #0071e3;
      background: rgba(0,113,227,0.04);
    }
    .varname-item.copied {
      border-color: #34c759;
      background: rgba(52,199,89,0.08);
    }
    
    /* 步骤指示器 */
    .steps {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .step {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: all 0.3s;
    }
    .step.active {
      background: #0071e3;
      width: 24px;
      border-radius: 4px;
    }
    
    /* 提示文字 */
    .hint {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="composition" data-composition-id="workflow-demo" data-start="0" data-duration="12000" data-width="800" data-height="450">
    <div class="desktop"></div>
    
    <!-- 任务栏 -->
    <div class="taskbar">
      <div class="taskbar-icon">🪟</div>
      <div class="taskbar-icon">📁</div>
      <div class="taskbar-icon">🌐</div>
      <div class="taskbar-icon">⚙️</div>
    </div>
    
    <!-- Rasso 启动器 -->
    <div class="launcher" id="launcher">
      <div class="launcher-titlebar">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <div class="launcher-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="search-input" id="searchInput" readonly placeholder="">
      </div>
      <div class="launcher-results" id="resultsList"></div>
    </div>
    
    <!-- 编码转换插件 -->
    <div class="plugin-panel" id="coderPanel">
      <div class="plugin-header">
        <div class="plugin-icon">🔄</div>
        <div>
          <div class="plugin-title">编码转换</div>
          <div class="plugin-desc">Base64 / URL / Hex / Unicode / 时间戳 / Hash</div>
        </div>
      </div>
      <div class="plugin-content">
        <div class="coders-grid">
          <div class="coder-item">
            <div class="coder-name">Base64</div>
            <div class="coder-desc">编解码</div>
          </div>
          <div class="coder-item">
            <div class="coder-name">URL</div>
            <div class="coder-desc">编码解码</div>
          </div>
          <div class="coder-item">
            <div class="coder-name">Hex</div>
            <div class="coder-desc">十六进制</div>
          </div>
          <div class="coder-item">
            <div class="coder-name">Timestamp</div>
            <div class="coder-desc">时间戳转换</div>
          </div>
          <div class="coder-item">
            <div class="coder-name">MD5</div>
            <div class="coder-desc">哈希计算</div>
          </div>
          <div class="coder-item">
            <div class="coder-name">SHA-256</div>
            <div class="coder-desc">安全哈希</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 变量命名插件 -->
    <div class="plugin-panel" id="varnamePanel" style="background: rgba(245, 245, 247, 0.98); color: #1d1d1f;">
      <div class="plugin-header">
        <div class="plugin-icon">🐫</div>
        <div>
          <div class="plugin-title">小驼峰变量命名</div>
          <div class="plugin-desc">中文 → camelCase / PascalCase / snake_case</div>
        </div>
      </div>
      <div class="varname-content">
        <input type="text" class="varname-input" id="varnameInput" readonly placeholder="输入中文...">
        <div class="varname-results" id="varnameResults">
          <div class="varname-item">userName</div>
          <div class="varname-item">UserName</div>
          <div class="varname-item">user_name</div>
          <div class="varname-item">user-name</div>
        </div>
      </div>
    </div>
    
    <!-- 步骤指示器 -->
    <div class="steps">
      <div class="step active" data-step="0"></div>
      <div class="step" data-step="1"></div>
      <div class="step" data-step="2"></div>
      <div class="step" data-step="3"></div>
    </div>
    
    <!-- 提示 -->
    <div class="hint" id="hint"></div>
  </div>

  <script>
    // 简化版动画逻辑（替代 GSAP）
    const launcher = document.getElementById('launcher');
    const coderPanel = document.getElementById('coderPanel');
    const varnamePanel = document.getElementById('varnamePanel');
    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('resultsList');
    const varnameInput = document.getElementById('varnameInput');
    const hint = document.getElementById('hint');
    const steps = document.querySelectorAll('.step');
    
    const apps = [
      { icon: '🔄', title: '编码转换', sub: 'Base64/URL/Hex' },
      { icon: '🐫', title: '小驼峰变量命名', sub: '中文翻译' },
      { icon: '📷', title: '全屏截图', sub: 'Ctrl+Shift+A' },
    ];
    
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    
    async function animate() {
      // Step 1: 启动器出现
      launcher.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
      launcher.style.opacity = '1';
      launcher.style.transform = 'translateX(-50%) translateY(0)';
      await sleep(800);
      
      // Step 2: 输入搜索
      hint.textContent = '按 Alt+Space 唤出启动器';
      hint.style.opacity = '1';
      await sleep(1500);
      
      searchInput.value = '编码';
      resultsList.innerHTML = apps.map((app, i) => `
        <div class="result-item ${i === 0 ? 'active' : ''}">
          <div class="result-icon">${app.icon}</div>
          <div class="result-text">
            <div class="result-title">${app.title}</div>
            <div class="result-sub">${app.sub}</div>
          </div>
        </div>
      `).join('');
      hint.textContent = '输入关键词搜索';
      await sleep(1500);
      
      // Step 3: 打开编码转换插件
      steps.forEach((s, i) => s.classList.toggle('active', i === 1));
      launcher.style.opacity = '0';
      await sleep(300);
      coderPanel.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
      coderPanel.style.opacity = '1';
      coderPanel.style.transform = 'translate(-50%, -50%) scale(1)';
      hint.textContent = '点击打开插件';
      await sleep(2000);
      
      // Step 4: 切换到变量命名
      steps.forEach((s, i) => s.classList.toggle('active', i === 2));
      coderPanel.style.opacity = '0';
      coderPanel.style.transform = 'translate(-50%, -50%) scale(0.9)';
      await sleep(300);
      varnamePanel.style.opacity = '1';
      varnamePanel.style.transform = 'translate(-50%, -50%) scale(1)';
      varnameInput.value = '用户名';
      hint.textContent = '中文快速翻译为代码变量';
      await sleep(2000);
      
      // Step 5: 复制结果
      const items = document.querySelectorAll('.varname-item');
      items[0].classList.add('copied');
      hint.textContent = '点击复制，无缝粘贴';
      await sleep(1500);
      
      // 循环
      setTimeout(() => animate(), 1000);
    }
    
    animate();
  </script>
</body>
</html>
