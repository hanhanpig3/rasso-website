<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rasso · 原生质感 | Windows 11 Mica/Acrylic</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --mica-bg: rgba(243, 243, 243, 0.72);
      --fluent-dark: rgba(32, 32, 32, 0.75);
      --fluent-border: rgba(255, 255, 255, 0.08);
      --spring-ease: cubic-bezier(0.4, 0.0, 0.2, 1);
      --bounce-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    
    /* 导航 */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: rgba(32, 32, 32, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 24px;
      z-index: 1000;
    }
    .nav-brand {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-links { display: flex; gap: 16px; margin-left: 32px; }
    .nav-links a { color: rgba(255,255,255,0.7); font-size: 13px; transition: color 0.15s; }
    .nav-links a:hover { color: #fff; }
    .back-link {
      margin-left: auto;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }
    .back-link:hover { color: #fff; }
    
    /* 桌面背景 */
    .desktop-bg {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 30% 30%, rgba(0, 120, 212, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 70%, rgba(131, 56, 236, 0.15) 0%, transparent 50%),
        linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    
    /* 任务栏 */
    .taskbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(32, 32, 32, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 10;
    }
    .taskbar-icon {
      width: 40px; height: 40px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .taskbar-icon:hover { background: rgba(255,255,255,0.1); }
    .taskbar-icon svg { width: 24px; height: 24px; }
    
    /* 启动器容器 */
    .launcher-container {
      position: fixed;
      top: 50%;
      left: calc(50% - 200px);
      transform: translate(-50%, -50%);
      z-index: 100;
    }
    
    /* 启动器窗口 */
    .launcher-window {
      width: 500px;
      background: var(--fluent-dark);
      backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--fluent-border);
      border-radius: 8px;
      box-shadow: 
        0 32px 64px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
      transition: 
        height 0.35s var(--spring-ease),
        transform 0.35s var(--spring-ease);
      transform-origin: top center;
    }
    
    /* 状态 */
    .launcher-window.bar-state { height: 56px; }
    .launcher-window.search-state { height: 236px; }
    .launcher-window.expanded-state { height: 500px; }
    
    /* 标题栏 */
    .titlebar {
      height: 28px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      -webkit-app-region: drag;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .launcher-window.expanded-state .titlebar,
    .launcher-window.search-state:hover .titlebar { opacity: 1; }
    .titlebar-dots { display: flex; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-red { background: #ff5f57; }
    .dot-yellow { background: #febc2e; }
    .dot-green { background: #28c840; }
    
    /* 搜索栏 */
    .search-bar {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .search-icon {
      width: 18px; height: 18px;
      opacity: 0.5;
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.4); }
    .shortcut-hint {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 3px;
    }
    
    /* 结果列表 */
    .results-list {
      padding: 6px;
      max-height: 174px;
      overflow-y: auto;
    }
    .result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .result-item:hover, .result-item.active { background: rgba(255,255,255,0.08); }
    .result-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #0078d4, #00bcf2);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .result-text { flex: 1; }
    .result-title { font-size: 12px; font-weight: 500; }
    .result-sub { font-size: 10px; color: rgba(255,255,255,0.5); }
    .result-key {
      font-size: 9px;
      color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.06);
      padding: 2px 5px;
      border-radius: 2px;
    }
    
    /* 右侧控制面板 */
    .control-panel {
      position: fixed;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      width: 260px;
    }
    .control-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 12px;
    }
    .control-card h3 {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
      color: rgba(255,255,255,0.9);
    }
    .state-btn {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 5px;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      margin-bottom: 8px;
    }
    .state-btn:last-child { margin-bottom: 0; }
    .state-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
    .state-btn.active { background: rgba(0,120,212,0.3); border-color: rgba(0,120,212,0.5); }
    .state-spec {
      font-size: 9px;
      color: rgba(255,255,255,0.5);
      margin-top: 3px;
      font-family: 'Consolas', monospace;
    }
    .curve-info {
      font-family: monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.6);
      line-height: 1.8;
    }
    
    /* 贴图演示 */
    .pin-demo {
      position: fixed;
      left: 40px;
      bottom: 80px;
      width: 180px;
    }
    .pin-window {
      background: rgba(32,32,32,0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.3s var(--spring-ease);
    }
    .pin-window:hover { transform: scale(1.02); }
    .pin-toolbar {
      height: 24px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 4px;
      -webkit-app-region: drag;
    }
    .pin-toolbar .dot { width: 8px; height: 8px; }
    .pin-toolbar span {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      margin-left: 6px;
    }
    .pin-content {
      height: 100px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.8);
      font-size: 11px;
    }
    
    @media (max-width: 1024px) {
      .control-panel { display: none; }
      .pin-demo { display: none; }
      .launcher-container { left: 50%; }
    }
  </style>
</head>
<body>
  <div class="desktop-bg"></div>
  
  <nav class="nav">
    <div class="nav-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" fill="none"/>
      </svg>
      Rasso
    </div>
    <div class="nav-links">
      <a href="../index.html">← Overview</a>
      <a href="https://github.com/hanhanpig3/rasso">GitHub</a>
    </div>
    <a href="https://github.com/hanhanpig3/rasso/releases" class="back-link" target="_blank">下载 →</a>
  </nav>

  <!-- 可交互启动器 -->
  <div class="launcher-container">
    <div class="launcher-window bar-state" id="launcher">
      <div class="titlebar">
        <div class="titlebar-dots">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
      </div>
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索应用、命令..." autofocus>
        <span class="shortcut-hint">ESC</span>
      </div>
      <div class="results-list" id="resultsList"></div>
    </div>
  </div>

  <!-- 控制面板 -->
  <div class="control-panel">
    <div class="control-card">
      <h3>Three-State Morphing</h3>
      <button class="state-btn active" onclick="setLauncherState('bar')">
        Bar State (56px)
        <div class="state-spec">height: 56px · BAR_HEIGHT</div>
      </button>
      <button class="state-btn" onclick="setLauncherState('search')">
        Search Dropdown
        <div class="state-spec">height: min(460, 56 + n×54 + 8)</div>
      </button>
      <button class="state-btn" onclick="setLauncherState('expanded')">
        Expanded Window
        <div class="state-spec">height: 500px · EXPANDED_HEIGHT</div>
      </button>
    </div>
    <div class="control-card">
      <h3>Animation Curve</h3>
      <div class="curve-info">
        <div>cubic-bezier(0.4, 0, 0.2, 1)</div>
        <div style="margin-top: 6px;">Duration: 350ms</div>
        <div>Easing: Spring damping</div>
        <div style="margin-top: 6px; color: #0078d4;">GPU Composited</div>
        <div>No layout thrash</div>
      </div>
    </div>
  </div>

  <!-- 贴图演示 -->
  <div class="pin-demo">
    <div class="pin-window">
      <div class="pin-toolbar">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <span>screenshot.png</span>
      </div>
      <div class="pin-content">Ctrl+Shift+P</div>
    </div>
  </div>

  <!-- 任务栏 -->
  <div class="taskbar">
    <div class="taskbar-icon">
      <svg viewBox="0 0 24 24" fill="white"><path d="M3 3h8v8H3V3zm0 10h8v8H3v-8zm10-10h8v8h-8V3zm0 10h8v8h-8v-8z"/></svg>
    </div>
    <div class="taskbar-icon">
      <svg viewBox="0 0 24 24" fill="#0078d4"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12z"/></svg>
    </div>
    <div class="taskbar-icon" style="background: rgba(0,120,212,0.3);">
      <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14l-3-3 1.41-1.41L10 13.17l4.59-4.59L16 10l-6 6z"/></svg>
    </div>
  </div>

  <script>
    const launcher = document.getElementById('launcher');
    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('resultsList');
    
    const apps = [
      { icon: '🐫', title: '小驼峰变量命名', sub: 'camelCase / PascalCase', key: 'Enter' },
      { icon: '📷', title: '全屏截图', sub: 'Ctrl+Shift+A', key: '⌘A' },
      { icon: '📌', title: '贴图到桌面', sub: 'Ctrl+Shift+P', key: '⌘P' },
      { icon: '🧮', title: '即时计算', sub: '数学表达式', key: 'Enter' },
      { icon: '🔄', title: '编码转换', sub: 'Base64/URL/Hex', key: 'Enter' },
    ];
    
    function setLauncherState(state) {
      launcher.classList.remove('bar-state', 'search-state', 'expanded-state');
      launcher.classList.add(`${state}-state`);
      
      document.querySelectorAll('.state-btn').forEach(btn => btn.classList.remove('active'));
      event.target.closest('.state-btn').classList.add('active');
    }
    
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = apps.filter(app => 
        app.title.toLowerCase().includes(query) || 
        app.sub.toLowerCase().includes(query)
      );
      
      resultsList.innerHTML = filtered.map((app, i) => `
        <div class="result-item ${i === 0 ? 'active' : ''}">
          <div class="result-icon">${app.icon}</div>
          <div class="result-text">
            <div class="result-title">${app.title}</div>
            <div class="result-sub">${app.sub}</div>
          </div>
          <span class="result-key">${app.key}</span>
        </div>
      `).join('');
      
      if (filtered.length > 0) {
        setLauncherState('search');
      } else {
        setLauncherState('bar');
      }
    });
    
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        resultsList.innerHTML = '';
        setLauncherState('bar');
      }
    });
  </script>
</body>
</html>
